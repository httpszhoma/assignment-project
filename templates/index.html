<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectacle Booking</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Spectacle Booking System</h1>
  </header>

  <section id="spectacles">
    <h2>Spectacles</h2>
    <button id="loadSpectacles">Load Spectacles</button>
    <div id="spectacleList"></div>
  </section>

  <section id="tickets">
    <h2>Tickets</h2>
    <button id="loadTickets">Load All Tickets</button>
    <div id="ticketList"></div>
  </section>

  <section id="createTicket">
    <h2>Create Ticket</h2>
    <form id="ticketForm">
      <input type="text" id="ticketSpectacle" placeholder="Spectacle ID" required>
      <input type="text" id="ticketSeat" placeholder="Seat ID" required>
      <button type="submit">Create Ticket</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Spectacle Booking System</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
